### probe SFT for learning-progress scoring: 2,000 random eligible math rows, 1 epoch, otherwise the main recipe
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: false
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json
flash_attn: fa2
enable_liger_kernel: true
dataset: rsft_probe2k
dataset_dir: /scratch/yuanzhou1/reasoning_sft/data
cutoff_len: 16384
overwrite_cache: true
preprocessing_num_workers: 16
template: qwen
output_dir: /scratch/yuanzhou1/reasoning_sft/ckpt/probe2k
logging_steps: 1
save_strategy: "no"
plot_loss: true
overwrite_output_dir: true
include_num_input_tokens_seen: true
report_to: none
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000
